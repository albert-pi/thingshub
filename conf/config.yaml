thingshub: 
  attributes: # 节点属性，用于对集群节点进行分组。默认属性为thingshub
    - thingshub  
  log: 
    level: INFO 
  data-dir: D:/data/thingshub # 绝对路径 
    
  server: 
    wiretap: true  # 二进制日志 
#    boss-thread-size: 8  # boss线程 默认=cpu核心数
#    worker-thread-size: 16 # work线程 默认=cpu核心数*2
#    biz-thread-size: 32 # 业务线程数 默认=cpu核心数*10
#    biz-queue-size: 100000 #业务队列 默认=100000
#    message-max-size: 4194304 # 接收消息的最大限制 默认4194304(4M)
#    low-water-mark: 4000000 # 不建议配置 默认 32768
#    high-water-mark: 80000000 # 不建议配置 默认 65536
#    global-read-write-size: 10000000,100000000  全局读写大小限制
#    channel-read-write-size: 10000000,100000000 单个channel读写大小限制
#    options:
#      SO_BACKLOG: 2000

    mqtt: 
      host: 0.0.0.0
      port: 1883
      connect-timeout: 20 #连接超时时间。单位：秒
      keep-alive: 300 # 保活时间。单位：秒
#      ssl: 
#        crt: 
#        key: 
#        ca: 
#      ws: 
#        enable: false
#        port: 8883
#        path: /mqtt
#        ssl: 

    tcp: 
      host: 0.0.0.0
      port: 5000
      connect-timeout: 20 #连接超时时间。单位：秒
      keep-alive: 300 # 保活时间。单位：秒
#      ssl: 
#        crt: 
#        key: 
#        ca: 

    http: 
      host: 0.0.0.0
      port: 9280
      access-log: true
#      ssl: 
#        crt: 
#        key: 
#        ca: 
      auth: 
        # basic认证
        basic: 
          username: admin
          password: 123456
